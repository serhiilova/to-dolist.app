<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c2e9fb">
    <title>To-Do list</title>
    <link rel="stylesheet" href="todo.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div class="container1">
    <h1>Список справ</h1>
    <input id="task" placeholder="Введіть текст справи">
    <button id="saveTask">Добавити справу</button>
</div>

<h2>Збережені справи</h2>
 
<div class="container2">
        <ul id="ulId"></ul>
    <div class="downbutton">
        <button id="deleteTask">Видалити виконані справи</button>
        <button id="deleteAlltask">Очистити ввесь список</button>
    </div>
</div> 
     
<script src="todo.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
    }
</script>
</body>
</html>
